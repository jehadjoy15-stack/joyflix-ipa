name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Use Node 20 as required by Expo
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate iOS Native Project (Expo Prebuild)
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Compile Xcode Archive (Unsigned)
        run: |
          xcodebuild -workspace ios/JoyFlix.xcworkspace \
                     -scheme JoyFlix \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath ios/JoyFlix.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive

      - name: Package compiled .app into .ipa
        run: |
          mkdir -p build/Payload
          cp -r ios/JoyFlix.xcarchive/Products/Applications/*.app build/Payload/ || exit 1
          
          # Verify the app was copied successfully to prevent empty zip
          if [ -z "$(ls -A build/Payload)" ]; then
            echo "Error: No compiled .app found in Products/Applications!"
            exit 1
          fi
          
          cd build
          zip -r joyflix.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: joyflix-unsigned-ipa
          path: build/joyflix.ipa
